# conf.d files are included in the http block, so a map can live here.
map $uri $hntube_cache {
    ~^/data/      "public, max-age=3600";
    /             "no-cache";
    /index.html   "no-cache";
    default       "public, max-age=300";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/json text/css text/javascript application/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header Cache-Control $hntube_cache always;
    add_header X-Content-Type-Options nosniff always;
    # YouTube embeds need the page origin as referrer.
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ =404;
    }
}

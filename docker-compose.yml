# Public at https://hntube.ishan.eu.org via the vivoserver Cloudflare Tunnel.
# site/ is mounted read-only, so `npm run build` updates the live site without a restart.
services:
  hntube:
    image: nginx:1.29-alpine
    container_name: hntube
    restart: unless-stopped
    ports:
      - "127.0.0.1:9410:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
